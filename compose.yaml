name: apigw

x-kong-environment: &kong-environment
  KONG_DATABASE: postgres
  KONG_PG_HOST: postgres
  KONG_PG_PORT: 5432
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  KONG_PG_DATABASE: kong
  KONG_ANONYMOUS_REPORTS: "off"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kong
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kong -d kong]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  kong-migrations:
    image: ${KONG_IMAGE:-kong:3.9.4}
    profiles: [tools]
    environment: *kong-environment
    command: kong migrations bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    logging: *default-logging

  kong:
    image: ${KONG_IMAGE:-kong:3.9.4}
    restart: unless-stopped
    environment:
      <<: *kong-environment
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - 127.0.0.1:8000:8000
      - 127.0.0.1:8001:8001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
      - edge
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?GATEWAY_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      PORTAL_API_DOMAIN: ${PORTAL_API_DOMAIN:?PORTAL_API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      KONG_ADMIN_TOKEN: ${KONG_ADMIN_TOKEN:?KONG_ADMIN_TOKEN is required}
    ports:
      - 80:80
      - 443:443
    volumes:
      # Z gives the bind mount a private SELinux label on Rocky/RHEL and is
      # harmless on Ubuntu hosts without SELinux enforcement.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - edge
      - portal-edge
    logging: *default-logging

networks:
  private:
    internal: true
  edge:
  portal-edge:
    name: portal-edge
    external: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
